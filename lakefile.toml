name = "BoltzmannEntropy"
version = "0.1.0"
keywords = ["math", "physics"]
defaultTargets = ["BoltzmannEntropy"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Physlib brings in Mathlib (pinned to the matching version) as a dependency.
[[require]]
name = "physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "v4.35.0"

[[lean_lib]]
name = "BoltzmannEntropy"
